<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BookFindr - Discover Your Next Read">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="manifest" href="img/site.webmanifest">
    <link rel="stylesheet" href="css/styles.css">
    <title>My Reading List - BookFindr</title>
</head>
<body>
    <header class="main-header">
        <a href="/" class="logo-wrapper">
            <img src="img/logo.png" alt="BookFindr Logo" class="logo">
        </a>
        <section class="intro">
            <p class="intro-text">Discover Your Next Read</p>
        </section>
    </header>
    <nav class="main-nav" aria-label="Main Navigation">
        <ul class="nav-list">
          
        </ul>
    </nav>
    <main>
        <section aria-labelledby="search-reading-list-section">
            <h2>My Reading List</h2>
            <table aria-label="My Reading List" id="reading-list-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author(s)</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reading-list-body">
                </tbody>
            </table>
        </section>
    </main>
    <footer class="main-footer">
        <hr>
        <nav class="footer-nav"></nav>
        <p id="copyright-info">&copy; 2026 BookFindr. All rights reserved.</p>
    </footer>
    <script src="js/nav.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
